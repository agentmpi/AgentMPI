[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmpi"
version = "1.0.0"
description = "AgentMPI: a message passing interface for multi-agent systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
tokens = ["tiktoken>=0.5"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
ampi = "ampi.cli:main"
ampirun = "ampi.launcher:main"

[tool.setuptools.packages.find]
include = ["ampi*", "conformance*"]

[tool.pytest.ini_options]
testpaths = ["tests", "conformance"]
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "slow: tests that take more than a second",
    "device: parametrised over every conforming device",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
