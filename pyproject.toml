[project]
name = "agentmpi"
version = "0.1.0"
description = "Agent Message Passing Interface: a portable protocol for multi-agent harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shuo Xin" }]
keywords = ["mpi", "multi-agent", "message-passing", "protocol"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agentmpi = "agentmpi.cli:main"
ampi-run = "agentmpi.runtime:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentmpi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
