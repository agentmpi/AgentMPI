[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmpi"
version = "0.1.0"
description = "AgentMPI: a message passing interface for multi-agent harness development"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentMPI authors" }]
keywords = ["multi-agent", "llm", "mpi", "message-passing", "collective-communication"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-timeout>=2"]
plot = ["matplotlib>=3.7"]

[project.scripts]
ampi = "agentmpi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 300
