[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmpi"
version = "0.1.0"
description = "AgentMPI: a message passing interface for multi-agent systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentMPI authors" }]
keywords = ["multi-agent", "llm", "mpi", "protocol", "message-passing", "hpc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Distributed Computing",
]
# The runtime deliberately has no required dependencies: it must be installable
# inside whatever sandbox an agent happens to run in.
dependencies = []

[project.optional-dependencies]
# Exact tokenisation instead of the structural estimator.
tokenizers = ["tiktoken>=0.5"]
# Plotting for the paper's figures.
figures = ["matplotlib>=3.7", "numpy>=1.24"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
ampi = "ampi.cli:main"

[tool.setuptools]
packages = ["ampi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# UP006/UP045 (PEP 585/604 annotation syntax) are deliberately not enforced: the
# codebase targets Python 3.10, uses `typing.List`/`Optional` consistently, and a
# mechanical rewrite of ~670 annotation sites is risk without benefit.
ignore = ["E501", "B008"]
