[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmpi"
version = "0.1.0"
description = "AgentMPI: a message-passing interface for multi-agent harnesses"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "The AgentMPI authors" }]
keywords = ["multi-agent", "mpi", "llm", "protocol", "distributed"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
plots = ["matplotlib>=3.7", "numpy>=1.24"]
dev = ["pytest>=7.4", "pytest-timeout>=2.2"]

[project.scripts]
ampi = "agentmpi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=180"
