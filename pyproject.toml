[project]
name = "agentmpi"
version = "0.1.0"
description = "Agent Message Passing Interface: a portable protocol for multi-agent harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Shuo Xin" }]
keywords = ["mpi", "multi-agent", "message-passing", "protocol"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
analysis = ["matplotlib>=3.7", "numpy>=1.24"]

[project.scripts]
agentmpi = "agentmpi.cli:main"
ampi-run = "agentmpi.runtime:main"
ampi = "ampi.cli:main"
ampirun = "ampi.launch:main"
ampi-analyse = "ampi.analysis:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { agentmpi_sql = "src/agentmpi_sql", ampi = "src/ampi" }
packages = [
    "agentmpi",
    "agentmpi.algorithms",
    "agentmpi.transport",
    "agentmpi_sql",
    "ampi",
    "ampi.core",
    "ampi.device",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
exclude = ["experiments/results"]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
ignore = ["E402", "E501", "UP042"]
select = ["E", "F", "I", "UP", "B"]
