[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmpi"
version = "1.0.0"
description = "AgentMPI: a message passing interface for multi-agent systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
tokens = ["tiktoken>=0.5"]
analysis = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.4", "matplotlib>=3.7"]

[project.scripts]
ampi = "ampi.cli:main"
ampirun = "ampitools.launcher:main"

[tool.setuptools.packages.find]
include = ["ampi*", "ampitools*", "conformance*"]

[tool.pytest.ini_options]
testpaths = ["tests", "conformance"]
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "slow: tests that take more than a second",
    "device: parametrised over every conforming device",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# The nested conditionals in the lock paths read as the two-step decision they
# are ("is it held?" then "is it mine?"); collapsing them obscures the argument.
"ampi/device/*.py" = ["SIM102"]
# The CLI's parser construction is a table.  One argument per line would triple
# the file's length and make the command surface harder, not easier, to read.
"ampi/cli.py" = ["E702", "SIM105"]
