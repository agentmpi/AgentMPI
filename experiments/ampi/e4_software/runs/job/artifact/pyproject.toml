[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenbudget"
version = "0.1.0"
description = "A library for planning and enforcing token budgets across a set of cooperating LLM agents."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tokenbudget = "tokenbudget.cli:main"

[tool.setuptools]
packages = ["tokenbudget"]
