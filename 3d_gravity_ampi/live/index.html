<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Chandra live monitor</title>
<meta name="description" content="Live status of the running Chandra missions: machines, packets, DAG, per-machine digests">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f5f6; --panel:#ffffff; --ink:#18232a; --ink-2:#4d5c66; --ink-3:#8593a0; --line:#d9e0e4; --line-2:#eef1f3;
  --accent:#0f7c8c; --accent-ink:#0a5a66; --accent-soft:#dcedf0;
  --ok:#2c8f5a; --ok-soft:#dff2e6; --warn:#c27a10; --warn-soft:#fbeed5; --bad:#c23b3b; --bad-soft:#f9dede; --idle:#7b8a95;
  --p0:#cfe4e8; --p1:#9fcbd3; --p2:#63aab7; --p3:#2f8796; --p4:#2a6a8e; --p5:#2e4f86; --p6:#3a3a7a; --p7:#4b2a6a; --p8:#5e2358; --p9:#6a2440; --p10:#733030;
  --shadow:0 1px 2px rgba(24,35,42,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121a1f; --panel:#1a242b; --ink:#e6ecef; --ink-2:#aab7c0; --ink-3:#71818c; --line:#2b3941; --line-2:#22303a;
  --accent:#4fb8c8; --accent-ink:#8fd5e0; --accent-soft:#1c3a41;
  --ok:#57c283; --ok-soft:#1c3a2a; --warn:#e0a03c; --warn-soft:#3f2f14; --bad:#e46767; --bad-soft:#43201f; --idle:#6f7f8a;
  --p0:#26424a; --p1:#2f5c66; --p2:#3a7a86; --p3:#4a98a6; --p4:#4f8fb7; --p5:#6182c6; --p6:#7f77c9; --p7:#9a6dbd; --p8:#b366a3; --p9:#c1667f; --p10:#c97a6a;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#121a1f; --panel:#1a242b; --ink:#e6ecef; --ink-2:#aab7c0; --ink-3:#71818c; --line:#2b3941; --line-2:#22303a;
  --accent:#4fb8c8; --accent-ink:#8fd5e0; --accent-soft:#1c3a41;
  --ok:#57c283; --ok-soft:#1c3a2a; --warn:#e0a03c; --warn-soft:#3f2f14; --bad:#e46767; --bad-soft:#43201f; --idle:#6f7f8a;
  --p0:#26424a; --p1:#2f5c66; --p2:#3a7a86; --p3:#4a98a6; --p4:#4f8fb7; --p5:#6182c6; --p6:#7f77c9; --p7:#9a6dbd; --p8:#b366a3; --p9:#c1667f; --p10:#c97a6a;
  --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45}
.mono{font-family:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:20px 20px 60px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;border-bottom:1px solid var(--line);padding-bottom:12px}
header h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
header .sub{color:var(--ink-2)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:500}
.drivers{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.driver{border:1px solid var(--line);background:var(--panel);padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline;font-size:13px}
.driver b{font-weight:500}
.job{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.job-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding:14px 18px;border-bottom:1px solid var(--line)}
.job-head h2{margin:0;font-size:17px;font-weight:600}
.job-head .meta{color:var(--ink-2);font-size:13px}
.strip{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line)}
.stat{padding:10px 18px;border-right:1px solid var(--line-2);min-width:120px}
.stat .v{font-size:20px;font-weight:500;line-height:1.15}
.stat .v small{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:3px}
.stat .k{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;line-height:18px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.idle{background:var(--line-2);color:var(--ink-2)} .pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.body{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0}
@media (max-width:900px){.body{grid-template-columns:1fr}}
.col{padding:14px 18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.col+.col{border-left:1px solid var(--line)}
@media (max-width:900px){.col+.col{border-left:0;border-top:1px solid var(--line)}}
section h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:500;display:flex;justify-content:space-between;gap:10px}
section h3 span{text-transform:none;letter-spacing:0;color:var(--ink-2)}
.colls{display:flex;flex-direction:column;gap:5px}
.coll{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;font-size:12.5px}
.coll .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coll .lab i{font-style:normal;color:var(--ink-3);margin-right:6px}
.bar{height:10px;background:var(--line-2);position:relative;overflow:hidden}
.bar b{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.bar b.j{background:var(--accent-soft)}
.bar.done b{background:var(--ok)}
.coll .n{text-align:right;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink-2);align-items:center}
.legend .sw{display:inline-block;width:11px;height:11px;vertical-align:-1px;margin-right:4px}
.nodes{display:flex;flex-direction:column;gap:6px}
.node{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center}
.node .nl{font-size:12px;color:var(--ink-2);line-height:1.25}
.node .nl small{display:block;color:var(--ink-3);font-size:11px}
.cells{display:flex;flex-wrap:wrap;gap:2px}
.cell{width:18px;height:18px;position:relative;background:var(--p0);border:2px solid transparent;cursor:default}
.cell.suspect{border-color:var(--warn)} .cell.failed{border-color:var(--bad);background:var(--bad-soft)!important} .cell.finalised{border-color:var(--ok)} .cell.absent{background:var(--line-2)!important;border-style:dashed;border-color:var(--line)}
.cell.expired::after{content:"";position:absolute;right:1px;bottom:1px;width:4px;height:4px;background:var(--bad)}
.cell.quiet{opacity:.45}
.cell:hover{outline:2px solid var(--ink);z-index:2}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;font-size:12px;border:0;z-index:10;display:none;max-width:320px;line-height:1.35}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font-size:10px;font-family:"IBM Plex Mono",monospace}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{padding:3px 6px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:top}
th{color:var(--ink-3);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.ev{display:grid;grid-template-columns:60px 36px 130px 1fr;gap:8px;font-size:12px;padding:2px 0;border-bottom:1px solid var(--line-2)}
.ev .k{color:var(--ink-2)} .ev .f{color:var(--bad)} .ev .d{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:13px;color:var(--ink-2);border-left:3px solid var(--accent);padding:6px 12px;background:var(--accent-soft);margin:0}
.note.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--ink)}
.note.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--ink)}
.tasks{font-size:12.5px;color:var(--ink-2)}
.tasks b{color:var(--ink);font-weight:500}
footer{color:var(--ink-3);font-size:12px;border-top:1px solid var(--line);padding-top:10px}

.wrap{max-width:1400px}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.live{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
.live.stale .dot{background:var(--warn);animation:none}.live.dead .dot{background:var(--bad);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(44,143,90,.5)}70%{box-shadow:0 0 0 7px rgba(44,143,90,0)}100%{box-shadow:0 0 0 0 rgba(44,143,90,0)}}
.ov{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.card h2{font-size:15px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .title{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.bar{height:10px;border-radius:5px;background:var(--line-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.kpi{border:1px solid var(--line-2);border-radius:6px;padding:5px 8px}
.kpi .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}.kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:500;border:1px solid transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.idle{background:var(--line-2);color:var(--ink-2)}.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
article.job{border:1px solid var(--line);background:var(--panel);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.job-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.job-head h2{font-size:16px;margin:0}.job-head .meta{color:var(--ink-3);font-size:12.5px}
.body{padding:12px 16px;display:grid;grid-template-columns:1fr;gap:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
section{margin-bottom:12px}
section h3{font-size:13px;margin:0 0 6px;display:flex;align-items:baseline;gap:8px}section h3 span{color:var(--ink-3);font-weight:400;font-size:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px}td,th{padding:4px 6px;border-bottom:1px solid var(--line-2);vertical-align:top;text-align:left}th{color:var(--ink-3);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.r{text-align:right}.dim{color:var(--ink-3)}.small{font-size:11.5px}
.mach{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.m{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:5px;border-left-width:4px}
.m.busy{border-left-color:var(--ok)}.m.idle{border-left-color:var(--idle)}.m.starting{border-left-color:var(--warn)}.m.dead,.m.lost,.m.stale{border-left-color:var(--bad)}.m.exited{border-left-color:var(--line)}
.m .hd{display:flex;justify-content:space-between;align-items:center;gap:6px}.m .hd b{font-size:13px}
.m .sum{font-size:12px;color:var(--ink-2);line-height:1.35}
.ctx{height:5px;background:var(--line-2);border-radius:3px;overflow:hidden}.ctx i{display:block;height:100%;background:var(--accent)}
.dagwrap{overflow:auto;border:1px solid var(--line-2);border-radius:8px;background:var(--bg)}
svg text{font-family:"IBM Plex Mono",Menlo,monospace;font-size:10.5px;fill:var(--ink)}
.n rect{stroke-width:1.2}.n.solid rect{fill:var(--ok-soft);stroke:var(--ok)}.n.preliminary rect,.n.hypothesis rect,.n.candidate rect{fill:var(--warn-soft);stroke:var(--warn)}
.n.blocking rect,.n.rejected rect,.n.refuted rect{fill:var(--bad-soft);stroke:var(--bad)}.n.planned rect{fill:var(--panel);stroke:var(--ink-3);stroke-dasharray:4 3}.n.external rect{fill:var(--line-2);stroke:var(--line)}
.n.active rect{stroke-width:2.6;stroke:var(--accent);filter:drop-shadow(0 0 3px var(--accent))}
.n.delivered rect{stroke-dasharray:2 2;stroke-width:2}
.edge{fill:none;stroke:var(--ink-3);stroke-opacity:.55;stroke-width:1.1}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--ink-2)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid}
.feed{max-height:360px;overflow:auto}.feed td:first-child{white-space:nowrap}
.digest{max-height:420px;overflow:auto}
.pk{border-left:3px solid var(--line);padding:4px 8px;margin:4px 0;font-size:12.5px}
.pk.done{border-left-color:var(--ok)}.pk.claimed{border-left-color:var(--accent)}.pk.queued{border-left-color:var(--idle)}.pk.abandoned{border-left-color:var(--bad)}
.pk .l{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.pk .notes{color:var(--ink-2);font-size:12px;margin-top:2px}
pre.dg{white-space:pre-wrap;font-size:11.5px;line-height:1.4;color:var(--ink-2);margin:0;max-height:260px;overflow:auto}
a{color:var(--accent-ink);text-decoration:none}a:hover{text-decoration:underline}
.tip{position:fixed;display:none;max-width:340px;background:var(--ink);color:var(--bg);font-size:11.5px;padding:7px 9px;border-radius:6px;white-space:pre-wrap;pointer-events:none;z-index:9}
footer{color:var(--ink-3);font-size:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:6px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--accent);color:#fff}
.modal{position:fixed;inset:0;background:rgba(10,20,26,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.open{display:flex}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:min(96vw,1500px);max-height:92vh;width:100%;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.panel .ph{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.panel .ph h2{margin:0;font-size:16px}.panel .ph .meta{color:var(--ink-3);font-size:12.5px;flex:1}
.panel .pb{padding:12px 16px;overflow:auto}
.x{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:3px 10px;cursor:pointer;font-family:inherit;font-size:12.5px}
.x:hover{background:var(--line-2)}
.dagwrap{max-height:70vh}
@media (max-width:600px){.panel{max-height:96vh}.dagwrap{max-height:70vh}}
@media (max-width:600px){.wrap{padding:12px 16px 40px}.two{grid-template-columns:1fr}}
</style>
<div class="wrap">
 <header>
  <div><h1>Chandra live monitor — running missions</h1>
  <div class="sub">Machines, packets, DAG and per-machine digests of the missions running now, read from the AgentMPI job branches and the mission branch of <a class="mono" href="https://github.com/agentmpi/3d_gravity_ampi/tree/claude/determined-edison-26dv8q">agentmpi/3d_gravity_ampi</a>. The review board with the PDFs is <a href="../">here</a>.</div></div>
  <div class="top"><span class="live" id="live"><span class="dot"></span><span id="livetxt">loading…</span></span><span class="mono" id="asof"></span><span class="mono dim" id="next"></span></div>
 </header>
 <div class="ov" id="ov"></div>
 <div id="jobs" style="display:flex;flex-direction:column;gap:18px"></div>
 <footer id="foot"></footer>
</div>
<div class="tip" id="tip"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="panel"><div class="ph"><h2 id="mtitle">DAG</h2><span class="meta" id="mmeta"></span><button class="x" id="mclose">close ✕</button></div><div class="pb" id="mbody"></div></div></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hm=t=>t?new Date(t*1000).toISOString().replace("T"," ").slice(0,16)+"Z":"–";
const nowS=()=>Date.now()/1000;
const dur=s=>{s=Math.max(0,Math.round(s));return s<60?`${s}s`:s<3600?`${Math.floor(s/60)}m`:s<86400?`${Math.floor(s/3600)}h${String(Math.floor(s%3600/60)).padStart(2,"0")}m`:`${Math.floor(s/86400)}d${Math.floor(s%86400/3600)}h`};
const ago=t=>t?dur(nowS()-t)+" ago":"–";
let S=null, lastFetch=0; const PERIOD=60;
const stPill=s=>({busy:"ok",idle:"idle",starting:"warn",dead:"bad",lost:"bad",stale:"bad",exited:"idle"}[s]||"idle");
const sessShort=s=>s?s.replace(/^cse_/,"…").slice(-8):"–";
const bucketPill=b=>({working:"ok",blocked:"warn",review_ready:"acc",completed:"idle",failed:"bad"}[b]||"idle");

function overview(){
  return S.missions.map(M=>{
    const total=Math.max(M.goals.length, M.nodes.length)||1, st=M.node_status||{};
    const solid=st.solid||0, prelim=(st.preliminary||0)+(st.hypothesis||0)+(st.candidate||0), bad=(st.blocking||0)+(st.rejected||0);
    const ranks=M.ranks||[], busy=ranks.filter(r=>r.state==="busy").length, idle=ranks.filter(r=>r.state==="idle").length, starting=ranks.filter(r=>r.state==="starting").length, bad_m=ranks.filter(r=>["dead","lost","stale"].includes(r.state)).length;
    const ts=M.task_states||{}; const host=M.host||{}, hl=host.live;
    const lastT=Math.max(0,...(M.events||[]).map(e=>e.t||0));
    const camp=M.campaign_state||(M.job_present?"?":"no job branch");
    return `<div class="card"><h2>${esc(M.paper)} <span class="pill ${camp==="open"?"ok":camp==="closed"?"idle":"warn"}">campaign ${esc(camp)}</span>${M.wave&&M.wave.wave!=null?`<span class="pill acc">wave ${M.wave.wave}</span>`:""}</h2>
    <div class="title">${esc(M.title||"")}</div>
    <div class="bar" data-tip="${esc(`${solid} solid · ${prelim} preliminary/hypothesis · ${bad} blocking/rejected · ${Math.max(0,total-solid-prelim-bad)} planned`)}"><i style="width:${100*solid/total}%;background:var(--ok)"></i><i style="width:${100*prelim/total}%;background:var(--warn)"></i><i style="width:${100*bad/total}%;background:var(--bad)"></i></div>
    <div class="kpis">
      <div class="kpi"><div class="v">${solid}<span class="dim">/${total}</span></div><div class="k">solid / goals</div></div>
      <div class="kpi"><div class="v">${busy}<span class="dim">/${ranks.length||M.pool.length}</span></div><div class="k">machines busy</div></div>
      <div class="kpi"><div class="v">${ts.claimed||0}<span class="dim"> · ${ts.queued||0}q</span></div><div class="k">packets live</div></div>
      <div class="kpi"><div class="v">${ts.done||0}</div><div class="k">delivered</div></div>
      <div class="kpi"><div class="v">${M.verdicts.filter(v=>v.verdict==="ADMIT").length}<span class="dim"> · ${M.verdicts.filter(v=>v.verdict!=="ADMIT").length}✗</span></div><div class="k">verdicts</div></div>
    </div>
    <div class="small"><b>host</b> <span class="mono">${esc(sessShort(host.session))}</span> ${hl?`<span class="pill ${bucketPill(hl.bucket)}">${esc(hl.bucket||hl.status)}</span> <span class="dim">${esc(hl.summary||"")}</span>`:'<span class="dim">no session snapshot</span>'}</div>
    <div class="small dim">machines: ${busy} busy · ${idle} idle · ${starting} starting${bad_m?` · <span style="color:var(--bad)">${bad_m} dead/lost</span>`:""} · last activity ${ago(lastT)} · <a href="#m-${esc(M.paper)}">details ↓</a></div>
    </div>`;}).join("");
}

function dag(M){
  // layered layout: externals (col 0) → ledger nodes by depth → planned goals from the brief (last col)
  const nodes=M.nodes.slice(), ids=new Set(nodes.map(n=>n.id));
  const claimed=new Set((M.tasks||[]).filter(t=>t.state==="claimed").map(t=>t.anchor));
  const delivered=new Set((M.tasks||[]).filter(t=>t.state==="done").flatMap(t=>(t.result&&t.result.nodes_worked)||[t.anchor]));
  const verd={}; (M.verdicts||[]).forEach(v=>{ if(!verd[v.node]) verd[v.node]=v; });
  const ext=(M.externals||[]).slice(0,30);
  const planned=M.goals.filter(g=>!ids.has(g));
  const maxd=nodes.length?Math.max(...nodes.map(n=>n.depth)):-1;
  const EXTCOL=12, nExt=Math.ceil(ext.length/EXTCOL);
  const colOf=n=>n.depth+nExt;
  const cols={}; const put=(c,item)=>{(cols[c]=cols[c]||[]).push(item)};
  ext.forEach((e,i)=>put(Math.floor(i/EXTCOL),{id:e,cls:"external",tip:"predecessor admitted in an earlier mission"}));
  nodes.sort((a,b)=>a.depth-b.depth||a.id.localeCompare(b.id)).forEach(n=>{
    let cls=n.status||"planned"; if(claimed.has(n.id)) cls+=" active"; else if(delivered.has(n.id)&&n.status!=="solid") cls+=" delivered";
    const v=verd[n.id]; put(colOf(n),{id:n.id,cls,tip:`${n.id} · ${n.status} · depth ${n.depth}${n.domain?" · "+n.domain:""}\n${n.summary}\ntrials ${n.trials}${v?`\nlast verdict: ${v.verdict} (wave ${v.wave})${v.reasons?" — "+v.reasons.slice(0,160):""}`:""}${claimed.has(n.id)?"\n● a machine is working this node now":""}`,preds:n.preds});
  });
  const pcol=nExt+maxd+1;
  planned.forEach(g=>{let cls="planned"; if(claimed.has(g)) cls+=" active"; else if(delivered.has(g)) cls+=" delivered"; put(pcol,{id:g,cls,tip:`${g}\nplanned in the mission brief; not yet in the knowledge ledger${claimed.has(g)?"\n● a machine is working this node now":delivered.has(g)?"\n◌ delivered, awaiting ingest/verdict":""}`});});
  const W=186,H=30,GX=46,GY=10,PAD=14; const ncol=Object.keys(cols).length; if(!ncol) return '<p class="dim small">no nodes yet</p>';
  const colKeys=Object.keys(cols).map(Number).sort((a,b)=>a-b); const idx={}; colKeys.forEach((c,i)=>idx[c]=i);
  const pos={}; let maxRows=0;
  colKeys.forEach(c=>{cols[c].forEach((it,i)=>{pos[it.id]={x:PAD+idx[c]*(W+GX),y:PAD+i*(H+GY)}}); maxRows=Math.max(maxRows,cols[c].length);});
  const width=PAD*2+ncol*W+(ncol-1)*GX, height=PAD*2+maxRows*(H+GY)-GY+16;
  let edges="";
  nodes.forEach(n=>(n.preds||[]).forEach(p=>{ if(!pos[p]||!pos[n.id]) return; const a=pos[p],b=pos[n.id]; const x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2,mx=(x1+x2)/2; edges+=`<path class="edge" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;}));
  let boxes="";
  colKeys.forEach(c=>cols[c].forEach(it=>{const p=pos[it.id]; const lab=it.id.length>24?it.id.slice(0,23)+"…":it.id; boxes+=`<g class="n ${it.cls}" data-tip="${esc(it.tip)}"><rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="5"/><text x="${p.x+8}" y="${p.y+19}">${esc(lab)}</text></g>`;}));
  const heads=colKeys.map(c=>`<text x="${PAD+idx[c]*(W+GX)}" y="${height-4}" style="fill:var(--ink-3)">${c<nExt?(c===0?"established earlier":""):c===pcol?"planned":"depth "+(c-nExt)}</text>`).join("");
  return `<div class="dagwrap"><svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${edges}${boxes}${heads}</svg></div>
  <div class="legend"><span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>solid</span><span><i style="background:var(--warn-soft);border-color:var(--warn)"></i>preliminary / hypothesis</span><span><i style="background:var(--bad-soft);border-color:var(--bad)"></i>blocking / rejected</span><span><i style="background:var(--panel);border-color:var(--ink-3);border-style:dashed"></i>planned (brief)</span><span><i style="background:var(--line-2);border-color:var(--line)"></i>established earlier</span><span><i style="border-color:var(--accent);border-width:2px;background:transparent"></i>being worked now</span><span><i style="border-style:dotted;border-color:var(--ink-2);background:transparent"></i>delivered, awaiting verdict</span></div>`;
}

function machines(M){
  const ranks=M.ranks||[]; const byRank={}; (M.pool||[]).forEach(p=>byRank[p.rank]=p);
  const tasksOf=r=>(M.tasks||[]).filter(t=>new RegExp(`^cloud:m${r}:`).test(t.worker_id||""));
  const rows=(ranks.length?ranks:(M.pool||[]).map(p=>({rank:p.rank,state:"starting",session:"",tasks_done:0}))).map(r=>{
    const p=byRank[r.rank]||{}; const live=p.live; const done=tasksOf(r.rank).filter(t=>t.state==="done").length;
    const ctx=r.ctx_budget?Math.min(100,100*(r.ctx_used||0)/r.ctx_budget):0;
    return `<div class="m ${r.state}"><div class="hd"><b>m${r.rank}</b><span class="pill ${stPill(r.state)}">${esc(r.state)}</span><span class="mono small dim">${esc(sessShort(r.session||p.session))}${p.generation&&p.generation>1?` · gen ${p.generation}`:""}</span></div>
    <div class="small">${r.task?`<b>working</b> <span class="mono">${esc(r.task)}</span> <span class="dim">for ${dur(nowS()-(r.since||nowS()))}</span>`:`<span class="dim">no packet leased</span>`}</div>
    <div class="small dim">lease ${r.lease_s!=null?(r.lease_s>0?dur(r.lease_s)+" left":"expired "+dur(-r.lease_s)+" ago"):"–"} · seen ${ago(r.last_seen)} · ${done} delivered${r.restarts?` · ${r.restarts} restarts`:""}${r.failure_kind?` · <span style="color:var(--bad)">${esc(r.failure_kind)}</span>`:""}</div>
    ${r.ctx_budget?`<div class="ctx" data-tip="context budget used by the AgentMPI runtime: ${r.ctx_used||0} / ${r.ctx_budget} tokens (peak ${r.ctx_peak||0})"><i style="width:${ctx}%"></i></div>`:""}
    ${live?`<div class="sum"><span class="pill ${bucketPill(live.bucket)}">${esc(live.bucket||live.status)}</span> ${esc(live.summary||"")}<span class="dim"> · session view ${ago(S.sessions_as_of)}</span></div>`:""}
    </div>`;}).join("");
  return `<div class="mach">${rows}</div>`;
}

function digests(M){
  const tasks=(M.tasks||[]).slice().sort((a,b)=>(b.claimed_at||b.queued_at||0)-(a.claimed_at||a.queued_at||0));
  if(!tasks.length) return '<p class="dim small">no packets posted yet (the host is decomposing or planning wave 1)</p>';
  const verd={}; (M.verdicts||[]).forEach(v=>{ if(!verd[v.node]) verd[v.node]=v; });
  const groups={}; tasks.forEach(t=>{const m=(t.worker_id||"").match(/^cloud:(m\d+):/); const k=m?m[1]:(t.state==="queued"?"queue":"unassigned"); (groups[k]=groups[k]||[]).push(t);});
  const keys=Object.keys(groups).sort((a,b)=>(a==="queue")-(b==="queue")||a.localeCompare(b,undefined,{numeric:true}));
  return keys.map(k=>`<section><h3>${k==="queue"?"queued, not yet claimed":k==="unassigned"?"unassigned":`machine ${k}`} <span>${groups[k].length} packet${groups[k].length>1?"s":""}</span></h3>${groups[k].map(t=>{
    const r=t.result||{}; const v=verd[t.anchor]||(r.nodes_worked||[]).map(n=>verd[n]).find(Boolean);
    const span=t.done_at&&t.claimed_at?dur(t.done_at-t.claimed_at):t.claimed_at?dur(nowS()-t.claimed_at)+" so far":"";
    return `<div class="pk ${t.state}"><div class="l"><span class="pill ${t.state==="done"?"ok":t.state==="claimed"?"acc":t.state==="abandoned"?"bad":"idle"}">${esc(t.state)}</span><span class="mono">${esc(t.label)}</span>${span?`<span class="dim small">${span}</span>`:""}${t.requeued?'<span class="pill warn">requeued</span>':""}${v?`<span class="pill ${v.verdict==="ADMIT"?"ok":"bad"}">${esc(v.verdict)} w${v.wave}</span>`:(t.state==="done"?'<span class="pill idle">awaiting verdict</span>':"")}</div>
    ${r.status?`<div class="notes">${r.files!=null?`${r.files} files`:""}${r.rows?` · rows ${Object.entries(r.rows).filter(([k,n])=>n).map(([k,n])=>`${n} ${k}`).join(", ")||"none"}`:""}${(r.nodes_worked||[]).length?` · nodes ${esc(r.nodes_worked.join(", "))}`:""}${r.compactions?` · ${r.compactions} compactions`:""}${t.delivery_branch?` · <a href="${S.repo}/tree/${esc(t.delivery_branch)}">delivery</a>`:""}</div>`:""}
    ${r.notes?`<div class="notes">“${esc(r.notes)}”</div>`:""}${t.reason?`<div class="notes" style="color:var(--bad)">${esc(t.reason)}</div>`:""}
    ${v&&v.reasons&&v.verdict!=="ADMIT"?`<div class="notes" style="color:var(--bad)">judge: ${esc(v.reasons.slice(0,300))}</div>`:""}</div>`;}).join("")}</section>`).join("");
}

function mission(M){
  const w=M.wave; const wave=w?`<section><h3>current wave ${w.wave!=null?`<span class="pill acc">wave ${w.wave}</span>`:""} <span>${esc(w.totals||"")}</span></h3>${w.scheduled.length?`<div class="small"><b>scheduled</b> ${w.scheduled.map(s=>`<span class="mono">${esc(s)}</span>`).join(" · ")}</div>`:""}${w.outcomes.length?`<ul class="small" style="margin:4px 0 0 16px;padding:0">${w.outcomes.slice(0,8).map(o=>`<li>${esc(o)}</li>`).join("")}</ul>`:'<div class="small dim">no outcomes recorded in this wave yet</div>'}</section>`:'<section><h3>current wave</h3><div class="small dim">the host has not written loop notes to the branch yet (first snapshot 5 min after wave 1)</div></section>';
  const verd=M.verdicts.length?`<section><h3>verdicts <span>${M.verdicts.length} · newest first</span></h3><div class="feed"><table>${M.verdicts.slice(0,25).map(v=>`<tr><td class="mono dim small">${esc(hm(v.t))}</td><td><span class="pill ${v.verdict==="ADMIT"?"ok":"bad"}">${esc(v.verdict)}</span></td><td class="mono"><a href="${v.url}">${esc(v.node)}</a> <span class="dim">w${v.wave}</span>${v.verdict!=="ADMIT"&&v.reasons?`<div class="small dim">${esc(v.reasons.slice(0,220))}</div>`:""}</td></tr>`).join("")}</table></div></section>`:"";
  const feed=`<section><h3>event feed <span>job trace · packets · verdicts · commits</span></h3><div class="feed"><table>${(M.events||[]).slice(0,60).map(e=>`<tr><td class="mono dim small">${esc(hm(e.t))}</td><td><span class="pill ${({packet:"acc",verdict:"ok",commit:"idle",job:"warn"})[e.src]||"idle"}">${esc(e.src)}</span></td><td class="small">${esc(e.text)}</td></tr>`).join("")||'<tr><td class="dim">nothing yet</td></tr>'}</table></div></section>`;
  const dg=M.digest_head?`<section><h3>host's human digest <span>written by the orchestrator every 5 context windows</span></h3><pre class="dg">${esc(M.digest_head)}</pre></section>`:"";
  const ranks=M.ranks||[]; const ms={}; ranks.forEach(r=>ms[r.state]=(ms[r.state]||0)+1);
  return `<article class="job" id="m-${esc(M.paper)}"><div class="job-head"><h2>${esc(M.paper)}</h2><span class="pill ${M.campaign_state==="open"?"ok":"idle"}">campaign ${esc(M.campaign_state||"?")}</span><button class="btn" data-dag="${esc(M.paper)}">⬡ DAG <span class="dim">${M.nodes.length} nodes</span></button><span class="meta">${M.job?`job ${esc(M.job.job_id)} · size ${M.job.size} · created ${hm(M.job.created_at)}`:"no job branch yet"} · <a href="${M.brief_url}">brief</a> · <a href="${M.steer_url}">STEER</a> · <a href="${M.job_branch_url}">job branch</a>${M.job_head?` <span class="dim">(updated ${ago(M.job_head.t)})</span>`:""}</span></div>
  <div class="body"><div class="two">
   <div><section><h3>machines <span>${ranks.length||M.pool.length} · ${Object.entries(ms).map(([k,v])=>`${v} ${k}`).join(" · ")||"from the registry; the job branch has no rank views yet"}</span></h3>${machines(M)}</section>${wave}${verd}</div>
   <div><section><h3>digest of each machine's work <span>packets newest first, with the delivery record and the validator's verdict</span></h3><div class="digest">${digests(M)}</div></section>${feed}${dg}</div>
  </div></div></article>`;
}

let openDag=null;
function showDag(paper){
  const M=S&&S.missions.find(m=>m.paper===paper); if(!M) return; openDag=paper;
  document.getElementById("mtitle").textContent=paper+" — DAG";
  const st=M.node_status||{};
  document.getElementById("mmeta").textContent=`${M.nodes.length} ledger nodes (${Object.entries(st).map(([k,v])=>`${v} ${k}`).join(", ")||"none"}) · ${M.goals.length} goals in the brief · ${(M.externals||[]).length} established predecessors · hover a node for its summary and last verdict`;
  document.getElementById("mbody").innerHTML=dag(M);
  document.getElementById("modal").classList.add("open");
}
function hideDag(){ openDag=null; document.getElementById("modal").classList.remove("open"); }
document.getElementById("mclose").onclick=hideDag;
document.getElementById("modal").addEventListener("click",e=>{ if(e.target.id==="modal") hideDag(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") hideDag(); });
document.addEventListener("click",e=>{ const b=e.target.closest("[data-dag]"); if(b) showDag(b.dataset.dag); });
function render(){
  if(!S) return;
  const age=nowS()-S.as_of; const el=document.getElementById("live");
  el.className="live "+(age<900?"":age<3600?"stale":"dead");
  document.getElementById("livetxt").textContent=age<900?"live · data "+dur(age)+" old":age<3600?"stale · data "+dur(age)+" old":"publisher down · data "+dur(age)+" old";
  document.getElementById("asof").textContent="snapshot "+hm(S.as_of)+" · branch "+S.branch_head.sha+" ("+ago(S.branch_head.t)+")";
  document.getElementById("ov").innerHTML=overview()||'<div class="card"><h2>no running missions</h2><div class="title">Every host in the registry is archived or closed.</div></div>';
  document.getElementById("jobs").innerHTML=S.missions.map(mission).join("");
  if(openDag) showDag(openDag);
  document.getElementById("foot").innerHTML=`Snapshot published by <span class="mono">tools/board/live_loop.sh</span> every few minutes from the remote refs only; this page re-reads <span class="mono">live.json</span> every ${PERIOD}s. Machine state follows the AgentMPI rank views (lease alive + packet held = busy); packets are the broker's task rows; verdicts are the orchestrator's validator files. ${S.phase_note?esc(S.phase_note):""}`;
}
async function load(){
  try{const r=await fetch("live.json?ts="+Date.now(),{cache:"no-store"}); if(r.ok){S=await r.json(); lastFetch=nowS(); render();}}
  catch(e){ console.warn(e); }
}
load(); setInterval(load, PERIOD*1000);
setInterval(()=>{ if(!S) return; const left=Math.max(0,Math.round(PERIOD-(nowS()-lastFetch))); document.getElementById("next").textContent=`next read in ${left}s`; if(Math.round(nowS())%10===0) render(); },1000);
const tip=document.getElementById("tip");
document.addEventListener("mousemove",e=>{const c=e.target.closest("[data-tip]"); if(!c){tip.style.display="none";return;} tip.textContent=c.dataset.tip; tip.style.display="block"; tip.style.left=Math.min(innerWidth-350,e.clientX+12)+"px"; tip.style.top=(e.clientY+12)+"px";});
</script></html>
